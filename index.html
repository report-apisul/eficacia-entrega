<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Eficácia na Entrega</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">

  <header class="bg-slate-900 text-white py-4 px-6 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🚚</span>
      <h1 class="text-xl font-bold tracking-wide">Eficácia na Entrega</h1>
    </div>
    <div id="statusConexao" class="text-xs bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full border border-amber-500/30">
      Conectando à API...
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- FILTROS -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Transportadora</label>
        <select id="filterTransportadora" onchange="aplicarFiltros()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">Todas as Transportadoras</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Responsável</label>
        <select id="filterResponsavel" onchange="aplicarFiltros()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">Todos os Responsáveis</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Buscar</label>
        <input type="text" id="filterBusca" onkeyup="aplicarFiltros()" placeholder="Filtrar por texto..." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </section>

    <!-- CARDS KPIS -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total de Viagens</span>
        <div id="kpiTotal" class="text-3xl font-extrabold text-slate-800 mt-2">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Transportadoras</span>
        <div id="kpiTransportadoras" class="text-3xl font-extrabold text-blue-600 mt-2">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Responsáveis</span>
        <div id="kpiResponsaveis" class="text-3xl font-extrabold text-emerald-600 mt-2">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Média Diária</span>
        <div id="kpiMediaDiaria" class="text-3xl font-extrabold text-amber-500 mt-2">0</div>
      </div>
    </section>

    <!-- GRÁFICOS -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-2">
        <h2 class="text-base font-bold text-slate-700 mb-4">Evolução de Viagens por Data</h2>
        <div class="h-64"><canvas id="chartEvolucao"></canvas></div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-700 mb-4">Share por Transportadora</h2>
        <div class="h-64 flex justify-center"><canvas id="chartShare"></canvas></div>
      </div>
    </section>

    <!-- TABELA -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex justify-between items-center">
        <h2 class="text-base font-bold text-slate-700">Registros Operacionais</h2>
        <span id="tableCount" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">0 registros</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase tracking-wider">
              <th class="py-3 px-4">Carimbo Data/Hora</th>
              <th class="py-3 px-4">Data da Viagem</th>
              <th class="py-3 px-4">Transportadora</th>
              <th class="py-3 px-4">Responsável</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 text-slate-700">
            <tr><td colspan="4" class="py-8 text-center text-slate-400">Carregando dados da API...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyD0071pyIgbbg0rYCk6hlR6Y8WluFLVVVlT48Cfd3l9B9iCgFu4jGDXGxOyjwLMkZS6A/exec";

    let rawData = [];
    let chartEvolucaoInstance = null;
    let chartShareInstance = null;

    document.addEventListener("DOMContentLoaded", carregarDadosAPI);

    function carregarDadosAPI() {
      const statusEl = document.getElementById('statusConexao');
      
      fetch(API_URL, {
        method: "GET",
        redirect: "follow"
      })
      .then(response => {
        if (!response.ok) throw new Error("Falha na resposta da API");
        return response.json();
      })
      .then(json => {
        if (json.status === "sucesso") {
          rawData = json.dados;
          statusEl.innerText = `Conectado (${rawData.length} registros)`;
          statusEl.className = "text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30";

          popularFiltros(rawData);
          aplicarFiltros();
        } else {
          throw new Error(json.mensagem || "Erro no retorno da API");
        }
      })
      .catch(err => {
        console.error("Erro CORS/API:", err);
        statusEl.innerText = "Erro ao carregar dados";
        statusEl.className = "text-xs bg-red-500/20 text-red-400 px-3 py-1 rounded-full border border-red-500/30";
      });
    }

    function popularFiltros(data) {
      const transportadoras = [...new Set(data.map(d => d.transportadora))].filter(Boolean).sort();
      const responsaveis = [...new Set(data.map(d => d.responsavel))].filter(Boolean).sort();

      const selectTransp = document.getElementById('filterTransportadora');
      selectTransp.innerHTML = '<option value="ALL">Todas as Transportadoras</option>';
      transportadoras.forEach(t => selectTransp.innerHTML += `<option value="${t}">${t}</option>`);

      const selectResp = document.getElementById('filterResponsavel');
      selectResp.innerHTML = '<option value="ALL">Todos os Responsáveis</option>';
      responsaveis.forEach(r => selectResp.innerHTML += `<option value="${r}">${r}</option>`);
    }

    function aplicarFiltros() {
      const transpVal = document.getElementById('filterTransportadora').value;
      const respVal = document.getElementById('filterResponsavel').value;
      const buscaVal = document.getElementById('filterBusca').value.toLowerCase();

      const dadosFiltrados = rawData.filter(item => {
        const matchTransp = transpVal === "ALL" || item.transportadora === transpVal;
        const matchResp = respVal === "ALL" || item.responsavel === respVal;
        const matchBusca = !buscaVal || 
          item.transportadora.toLowerCase().includes(buscaVal) ||
          item.responsavel.toLowerCase().includes(buscaVal) ||
          item.dataViagem.includes(buscaVal);

        return matchTransp && matchResp && matchBusca;
      });

      atualizarKPIs(dadosFiltrados);
      renderizarTabela(dadosFiltrados);
      renderizarGraficos(dadosFiltrados);
    }

    function atualizarKPIs(data) {
      document.getElementById('kpiTotal').innerText = data.length;
      document.getElementById('kpiTransportadoras').innerText = new Set(data.map(d => d.transportadora)).size;
      document.getElementById('kpiResponsaveis').innerText = new Set(data.map(d => d.responsavel)).size;

      const datasUnicas = new Set(data.map(d => d.dataViagem)).size;
      document.getElementById('kpiMediaDiaria').innerText = datasUnicas > 0 ? (data.length / datasUnicas).toFixed(1) : 0;
    }

    function renderizarTabela(data) {
      const tbody = document.getElementById('tableBody');
      document.getElementById('tableCount').innerText = `${data.length} registros`;
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">Nenhum registro encontrado</td></tr>`;
        return;
      }

      data.forEach(item => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-3 px-4 font-mono text-xs text-slate-500">${item.timestamp}</td>
            <td class="py-3 px-4 font-medium">${item.dataViagem}</td>
            <td class="py-3 px-4"><span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-semibold bg-slate-100 text-slate-700">${item.transportadora}</span></td>
            <td class="py-3 px-4">${item.responsavel}</td>
          </tr>
        `;
      });
    }

    function renderizarGraficos(data) {
      const datasAgrupadas = {};
      data.forEach(d => { datasAgrupadas[d.dataViagem] = (datasAgrupadas[d.dataViagem] || 0) + 1; });

      const labelsEvolucao = Object.keys(datasAgrupadas).sort();
      const valoresEvolucao = labelsEvolucao.map(k => datasAgrupadas[k]);

      if (chartEvolucaoInstance) chartEvolucaoInstance.destroy();

      const ctxEvolucao = document.getElementById('chartEvolucao').getContext('2d');
      chartEvolucaoInstance = new Chart(ctxEvolucao, {
        type: 'line',
        data: {
          labels: labelsEvolucao,
          datasets: [{
            label: 'Viagens',
            data: valoresEvolucao,
            borderColor: '#2563EB',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const transpAgrupadas = {};
      data.forEach(d => { transpAgrupadas[d.transportadora] = (transpAgrupadas[d.transportadora] || 0) + 1; });

      const labelsShare = Object.keys(transpAgrupadas);
      const valoresShare = labelsShare.map(k => transpAgrupadas[k]);

      if (chartShareInstance) chartShareInstance.destroy();

      const ctxShare = document.getElementById('chartShare').getContext('2d');
      chartShareInstance = new Chart(ctxShare, {
        type: 'doughnut',
        data: {
          labels: labelsShare,
          datasets: [{
            data: valoresShare,
            backgroundColor: ['#10B981', '#2563EB', '#F59E0B', '#6366F1', '#EC4899']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  </script>
</body>
</html>
